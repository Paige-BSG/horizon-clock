[package]
name = "horizon-netease-probe"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
ncm-api-rs = { git = "https://github.com/SPlayer-Dev/ncm-api-rs.git", rev = "133b65bfe482e41ebccf018870d3fce07bf58eb3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Enable HTTP/2 in the SDK's existing reqwest client.
reqwest = { version = "0.12", default-features = false, features = ["http2"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }
