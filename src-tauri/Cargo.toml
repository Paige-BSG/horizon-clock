[package]
name = "horizon-clock"
version = "0.2.0-alpha.2"
description = "An ambient wall clock for Omarchy and Linux tablets"
authors = ["Paige-BSG"]
license = "MIT"
repository = "https://github.com/Paige-BSG/horizon-clock"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
native-qa = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(unix)'.dependencies]
ncm-api-rs = { git = "https://github.com/SPlayer-Dev/ncm-api-rs.git", rev = "133b65bfe482e41ebccf018870d3fce07bf58eb3", default-features = false }
# Enable HTTP/2 in the SDK's existing shared client.
reqwest = { version = "0.12", default-features = false, features = ["http2"] }
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
url = "2"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
keepawake = "0.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
raw-window-handle = "0.6"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
