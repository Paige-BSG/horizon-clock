[package]
name = "horizon-clock"
version = "0.2.0-alpha.1"
description = "An ambient wall clock for Omarchy and Linux tablets"
authors = ["Paige-BSG"]
license = "MIT"
repository = "https://github.com/Paige-BSG/horizon-clock"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
keepawake = "0.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
