[package]
name = "horizon-clock"
version = "0.2.0-alpha.2"
description = "An ambient wall clock for Omarchy and Linux tablets"
authors = ["Paige-BSG"]
license = "MIT"
repository = "https://github.com/Paige-BSG/horizon-clock"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
native-qa = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
keepawake = "0.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
raw-window-handle = "0.6"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
